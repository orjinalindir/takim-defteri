name: takim_defteri
description: "Doğu ve Güneydoğu Anadolu düğün kültürüne özel takı defteri uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Network
  connectivity_plus: ^6.0.3

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.2.0

  # DI
  get_it: ^7.7.0

  # Charts
  fl_chart: ^0.68.0

  # Calendar
  table_calendar: ^3.1.2

  # UI
  shimmer: ^3.0.0

  # Background Service
  flutter_background_service: ^5.0.5

  # URL Launcher
  url_launcher: ^6.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
